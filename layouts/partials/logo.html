<a id="logo" href="{{ "index.html" | relURL }}" title="{{ .Site.Title }}">
  <img
    height="70"
    style="vertical-align: middle"
    alt="{{ .Site.Title }}"
    {{ if or (eq hugo.Environment "offline") (eq hugo.Environment "github") }}
      src="{{ "images/white-logo.svg" | relURL }}"
    {{ else }}
      src="{{ "/images/white-logo.svg" | relURL }}"
    {{ end }}
  />

  <logoBanner id="title">
    {{ with .Site.Params.logoBannerText }}
      {{ . }}
    {{ else }}
      {{ with $.Site.Params.themeVariant }}
        {{ if reflect.IsSlice . }}{{ index . 0 }}{{ else }}{{ . }}{{ end }}
      {{ end }}
    {{ end }}
  </logoBanner>

  <logoBannerFreeForm id="subtitle">
    {{ $.Site.Params.logoBannerSubText }}
  </logoBannerFreeForm>
</a>
